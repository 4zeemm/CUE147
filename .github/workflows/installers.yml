# Builds the Windows and Mac installers of CUE 147.
# Run it by hand (Actions > Build installers > Run workflow), or push a version tag like v2.0.0.
name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer (.msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build the installer
        run: .\build-installer.bat
      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: cue147-windows-installer
          path: target/installer/*.msi
          if-no-files-found: error

  mac:
    name: Mac installer (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build the installer
        run: ./build-installer.sh
      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: cue147-mac-installer
          path: target/installer/*.dmg
          if-no-files-found: error

  # When a version tag is pushed, both installers are attached to a GitHub release.
  release:
    name: Release
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/**/*
          generate_release_notes: true
