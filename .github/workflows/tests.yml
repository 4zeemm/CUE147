# Compiles CUE 147 and runs the tests that do not need a screen or a database.
name: Build and unit tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build and run the JUnit tests
        run: ./mvnw -B package
      # The database and GUI tests (./test.sh) need MySQL and a screen, so they run on the club computer.
